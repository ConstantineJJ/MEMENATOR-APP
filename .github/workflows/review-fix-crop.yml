name: Review Fix Crop

on:
  push:
    branches:
      - fix/review-critical-pass

permissions:
  contents: write

jobs:
  patch-crop:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply crop correctness fixes
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise AssertionError(label)
              return text.replace(old, new, 1)

          def between(text, start, end, new, label):
              a = text.find(start)
              if a < 0:
                  if new in text:
                      return text
                  raise AssertionError(label + ' start')
              b = text.find(end, a)
              if b < 0:
                  raise AssertionError(label + ' end')
              return text[:a] + new + text[b:]

          p = Path('src/components/CropZoomModal.tsx')
          t = p.read_text(encoding='utf-8')

          helpers = "\n".join([
              "  const imgRef = useRef<HTMLImageElement | null>(null);",
              "",
              "  const getImageAspect = () => {",
              "    const img = imgRef.current;",
              "    const width = img?.naturalWidth || img?.width || 1;",
              "    const height = img?.naturalHeight || img?.height || 1;",
              "    return width / Math.max(1, height);",
              "  };",
              "",
              "  const getTargetPixelRatio = (ratio: AspectRatioOption): number | null => {",
              "    if (ratio === 'free') return null;",
              "    if (ratio === '1:1') return 1;",
              "    if (ratio === '4:3') return 4 / 3;",
              "    if (ratio === '16:9') return 16 / 9;",
              "    return 9 / 16;",
              "  };",
              "",
              "  const getPercentRatio = (ratio: AspectRatioOption): number | null => {",
              "    const targetPixelRatio = getTargetPixelRatio(ratio);",
              "    if (!targetPixelRatio) return null;",
              "    return targetPixelRatio / getImageAspect();",
              "  };",
              "",
              "  const constrainRatioSize = (width: number, maxWidth: number, maxHeight: number, percentRatio: number) => {",
              "    let nextW = Math.max(1, Math.min(maxWidth, width));",
              "    let nextH = nextW / percentRatio;",
              "    if (nextH > maxHeight) { nextH = maxHeight; nextW = nextH * percentRatio; }",
              "    if (nextW < 15) { nextW = 15; nextH = nextW / percentRatio; }",
              "    if (nextH < 15) { nextH = 15; nextW = nextH * percentRatio; }",
              "    if (nextW > maxWidth) { nextW = maxWidth; nextH = nextW / percentRatio; }",
              "    if (nextH > maxHeight) { nextH = maxHeight; nextW = nextH * percentRatio; }",
              "    return { width: nextW, height: nextH };",
              "  };",
          ])
          t = once(t, "  const imgRef = useRef<HTMLImageElement | null>(null);", helpers, 'crop helpers')

          preset = "\n".join([
              "    const percentRatio = getPercentRatio(ratio);",
              "    if (!percentRatio) return;",
              "",
              "    setCropBox((prev) => {",
              "      const size = constrainRatioSize(Math.min(prev.width, 90), 90, 90, percentRatio);",
              "      const newX = Math.max(5, Math.min(95 - size.width, prev.x));",
              "      const newY = Math.max(5, Math.min(95 - size.height, prev.y));",
              "      return { x: newX, y: newY, width: size.width, height: size.height };",
              "    });",
          ])
          t = between(t, "    let targetRatio = 1;", "\n\n  // Dragging the crop region box", preset, 'aspect preset')

          resize = "\n".join([
              "      } else if (isResizingCorner === 'br') {",
              "        const maxW = 100 - dragStart.boxX;",
              "        const maxH = 100 - dragStart.boxY;",
              "        const percentRatio = getPercentRatio(aspectRatio);",
              "        if (percentRatio) {",
              "          const size = constrainRatioSize(dragStart.boxW + deltaXPercent, maxW, maxH, percentRatio);",
              "          setCropBox((prev) => ({ ...prev, width: size.width, height: size.height }));",
              "        } else {",
              "          const newW = Math.max(15, Math.min(maxW, dragStart.boxW + deltaXPercent));",
              "          const newH = Math.max(15, Math.min(maxH, dragStart.boxH + deltaYPercent));",
              "          setCropBox((prev) => ({ ...prev, width: newW, height: newH }));",
              "        }",
              "      } else if (isResizingCorner === 'tl') {",
              "        const right = dragStart.boxX + dragStart.boxW;",
              "        const bottom = dragStart.boxY + dragStart.boxH;",
              "        const percentRatio = getPercentRatio(aspectRatio);",
              "        if (percentRatio) {",
              "          const size = constrainRatioSize(dragStart.boxW - deltaXPercent, right, bottom, percentRatio);",
              "          setCropBox({ x: right - size.width, y: bottom - size.height, width: size.width, height: size.height });",
              "        } else {",
              "          const newX = Math.max(0, Math.min(right - 15, dragStart.boxX + deltaXPercent));",
              "          const newY = Math.max(0, Math.min(bottom - 15, dragStart.boxY + deltaYPercent));",
              "          setCropBox({ x: newX, y: newY, width: right - newX, height: bottom - newY });",
              "        }",
              "      }",
          ])
          t = between(t, "      } else if (isResizingCorner === 'br') {", "\n    };\n\n    const handleMouseUp", resize, 'aspect resize')

          t = once(t, "  }, [isDraggingBox, isResizingCorner, dragStart, cropBox.width, cropBox.height]);", "  }, [isDraggingBox, isResizingCorner, dragStart, cropBox.width, cropBox.height, aspectRatio]);", 'crop effect deps')
          t = once(t, "    const canvas = document.createElement('canvas');\n    canvas.width = Math.max(200, Math.round(sourceW));\n    canvas.height = Math.max(200, Math.round(sourceH));", "    const canvas = document.createElement('canvas');\n    const minOutputDimension = 200;\n    const outputScale = Math.max(1, minOutputDimension / Math.max(1, Math.min(sourceW, sourceH)));\n    canvas.width = Math.max(1, Math.round(sourceW * outputScale));\n    canvas.height = Math.max(1, Math.round(sourceH * outputScale));", 'output aspect')
          t = once(t, "  if (!isOpen) return null;\n\n  return (", "  const effectiveImageSrc =\n    imageSrc.startsWith('http') && !imageSrc.includes(window.location.host)\n      ? `/api/proxy-image?url=${encodeURIComponent(imageSrc)}`\n      : imageSrc;\n\n  if (!isOpen) return null;\n\n  return (", 'proxy source')
          t = once(t, "                src={imageSrc}", "                src={effectiveImageSrc}", 'proxied image')
          p.write_text(t, encoding='utf-8')

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified crop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CropZoomModal.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: correct crop ratios, CORS and output scaling [skip-review-fix]"
          git push
