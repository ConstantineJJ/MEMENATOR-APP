name: Repair Temporary Review Workflow

on:
  push:
    branches:
      - fix/review-critical-pass

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair generated crop block
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/review-fix-client-core.yml')
          t = p.read_text(encoding='utf-8')
          old = """              \"          setCropBox({ x: newX, y: newY, width: right - newX, height: bottom - newY });\",\n              \"        }\",\n          ])\n          t = replace_between(t, \"      } else if (isResizingCorner === 'br') {\""""
          new = """              \"          setCropBox({ x: newX, y: newY, width: right - newX, height: bottom - newY });\",\n              \"        }\",\n              \"      }\",\n          ])\n          t = replace_between(t, \"      } else if (isResizingCorner === 'br') {\""""
          if old not in t:
              raise SystemExit('repair anchor not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/review-fix-client-core.yml
          git commit -m "chore: repair temporary client review workflow [skip-repair]"
          git push
