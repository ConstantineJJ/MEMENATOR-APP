name: Sync package lock once

on:
  push:
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: "${{ contains(github.event.head_commit.message, 'deps: add React type definitions') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize React type dependency lockfile"
          git push
