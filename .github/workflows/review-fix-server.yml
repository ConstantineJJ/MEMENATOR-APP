name: Review Fix Server Patch

on:
  push:
    branches:
      - fix/review-critical-pass

permissions:
  contents: write

jobs:
  patch-server:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Apply reviewed server fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "import { getAggregatedWebMemes } from './server/memeAggregator';"
          new_import = old_import + "\nimport { proxyExternalImage } from './server/imageProxy';"
          if "./server/imageProxy" not in text:
              assert old_import in text, 'memeAggregator import anchor not found'
              text = text.replace(old_import, new_import, 1)

          if 'const PORT = 3000;' in text:
              text = text.replace('const PORT = 3000;', "const PORT = Number(process.env.PORT || 3000);", 1)

          old_retry = "const isTransient = msg.includes('503') || msg.includes('high demand') || msg.includes('unavailable') || msg.includes('overloaded');"
          new_retry = "const isTransient = msg.includes('503') || msg.includes('429') || msg.includes('resource_exhausted') || msg.includes('high demand') || msg.includes('unavailable') || msg.includes('overloaded');"
          if old_retry in text:
              text = text.replace(old_retry, new_retry, 1)

          proxy_pattern = re.compile(
              r"  // Proxy external images to prevent canvas CORS tainting\n"
              r"  app\.get\('/api/proxy-image', async \(req, res\) => \{.*?\n"
              r"  \}\);\n\n"
              r"(?=  // Curated viral internet templates)",
              re.S,
          )
          replacement = (
              "  // Proxy external images through a strict allowlist, redirect validation,\n"
              "  // MIME validation, timeout protection and a hard response-size cap.\n"
              "  app.get('/api/proxy-image', proxyExternalImage);\n\n"
          )
          text, count = proxy_pattern.subn(replacement, text, count=1)
          assert count == 1 or "app.get('/api/proxy-image', proxyExternalImage);" in text, 'proxy route anchor not found'

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "No server changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts package-lock.json
          git commit -m "security: wire hardened image proxy and server guards [skip-review-fix]"
          git push
