name: Review Fix Core Safe

on:
  push:
    branches:
      - fix/review-critical-pass

permissions:
  contents: write

jobs:
  patch-core:
    if: ${{ !contains(github.event.head_commit.message, '[skip-review-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed core fixes
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise AssertionError(label)
              return text.replace(old, new, 1)

          def between(text, start, end, new, label):
              a = text.find(start)
              if a < 0:
                  if new in text:
                      return text
                  raise AssertionError(label + ' start')
              b = text.find(end, a)
              if b < 0:
                  raise AssertionError(label + ' end')
              return text[:a] + new + text[b:]

          p = Path('src/App.tsx')
          t = p.read_text(encoding='utf-8')
          t = once(t, "import { getBase64FromImageUrl } from './utils/imageHelper';", "import { getImagePayloadFromUrl } from './utils/imageHelper';", 'image helper import')
          t = once(t, "  const isUndoRedoAction = useRef(false);\n\n  // Autosave status indicator", "  const isUndoRedoAction = useRef(false);\n  const lastPushedRef = useRef<string>('');\n  const lastAnalyzedSrcRef = useRef<string>('');\n  const captionRequestInFlightRef = useRef(false);\n\n  // Autosave status indicator", 'refs')
          t = once(t, "      setHistory([initialState]);\n      setHistoryIndex(0);", "      lastPushedRef.current = JSON.stringify(initialState);\n      setHistory([initialState]);\n      setHistoryIndex(0);", 'initial history')
          t = once(t, "  // Record history on meaningful changes (debounced)\n  const lastPushedRef = useRef<string>('');\n  useEffect(() => {", "  // Record history on meaningful changes (debounced)\n  useEffect(() => {", 'history ref dedupe')
          t = once(t, "  // Autosave Draft to localStorage\n  useEffect(() => {\n    const timer = setTimeout(() => {", "  // Autosave Draft to localStorage\n  useEffect(() => {\n    setIsDraftSaved(false);\n    const timer = setTimeout(() => {", 'autosave pending')
          t = once(t, "  const handleApplyCrop = (croppedDataUrl: string) => {\n    setActiveImageSrc(croppedDataUrl);\n    runCompositionAnalysis(croppedDataUrl);\n    showToast('Кадрирование успешно применено!');\n  };", "  const handleApplyCrop = (croppedDataUrl: string) => {\n    setActiveImageSrc(croppedDataUrl);\n    showToast('Кадрирование успешно применено!');\n  };", 'crop analysis duplicate')
          t = once(t, "    if (originalImageSrc) {\n      setActiveImageSrc(originalImageSrc);\n      runCompositionAnalysis(originalImageSrc);\n      showToast('Исходное фото восстановлено!');", "    if (originalImageSrc) {\n      setActiveImageSrc(originalImageSrc);\n      showToast('Исходное фото восстановлено!');", 'reset analysis duplicate')
          t = once(t, "      const base64 = await getBase64FromImageUrl(srcToUse);\n      if (!base64) {\n        return;\n      }", "      const imagePayload = await getImagePayloadFromUrl(srcToUse);\n      if (!imagePayload) {\n        return;\n      }", 'composition payload')
          t = once(t, "          imageBase64: base64,\n          mimeType: 'image/jpeg',\n          width: 600,\n          height: 600,", "          imageBase64: imagePayload.dataUrl,\n          mimeType: imagePayload.mimeType,\n          width: imagePayload.width,\n          height: imagePayload.height,", 'composition metadata')
          t = once(t, "  // Run analysis when activeImageSrc changes\n  useEffect(() => {\n    runCompositionAnalysis(activeImageSrc);\n  }, [activeImageSrc, runCompositionAnalysis]);", "  // Run analysis once per image source change; avoid StrictMode duplicate quota use.\n  useEffect(() => {\n    if (!activeImageSrc || lastAnalyzedSrcRef.current === activeImageSrc) return;\n    lastAnalyzedSrcRef.current = activeImageSrc;\n    runCompositionAnalysis(activeImageSrc);\n  }, [activeImageSrc, runCompositionAnalysis]);", 'composition effect')
          t = once(t, "  const generateMagicCaptions = useCallback(async (overrideStyle?: string) => {\n    setIsGeneratingCaptions(true);\n    setCaptionError(null);", "  const generateMagicCaptions = useCallback(async (overrideStyle?: string) => {\n    if (captionRequestInFlightRef.current) return;\n    captionRequestInFlightRef.current = true;\n    setIsGeneratingCaptions(true);\n    setCaptionError(null);", 'caption guard')
          t = once(t, "    try {\n      const base64 = await getBase64FromImageUrl(activeImageSrc);\n\n      const compositionPayload = compositionAnalysis ? {", "    try {\n      const imagePayload = await getImagePayloadFromUrl(activeImageSrc);\n      if (!imagePayload) throw new Error('Не удалось подготовить изображение для анализа.');\n\n      const compositionPayload = compositionAnalysis ? {", 'caption payload')
          t = once(t, "          imageBase64: base64,\n          style: styleToUse,", "          imageBase64: imagePayload.dataUrl,\n          mimeType: imagePayload.mimeType,\n          style: styleToUse,", 'caption mime')
          t = once(t, "    } finally {\n      setIsGeneratingCaptions(false);\n    }", "    } finally {\n      captionRequestInFlightRef.current = false;\n      setIsGeneratingCaptions(false);\n    }", 'caption guard release')
          p.write_text(t, encoding='utf-8')

          p = Path('src/components/MemeCanvas.tsx')
          t = p.read_text(encoding='utf-8')
          old = "drawMemeOnCanvas(canvas, loadedImage, textBoxes, stickers, filter, watermark);"
          if t.count(old) == 2:
              t = t.replace(old, "drawMemeOnCanvas(canvas, loadedImage, textBoxes, stickers, filter, watermark, filterIntensity);")
          elif t.count(old) != 0:
              raise AssertionError('MemeCanvas export count')
          p.write_text(t, encoding='utf-8')

          p = Path('src/components/HistoryAndFavoritesPanel.tsx')
          t = p.read_text(encoding='utf-8')
          t = once(t, "            meme.filter,\n            meme.watermark\n          );", "            meme.filter,\n            meme.watermark,\n            meme.filterIntensity ?? 100\n          );", 'history intensity')
          p.write_text(t, encoding='utf-8')

          p = Path('server/memeAggregator.ts')
          t = p.read_text(encoding='utf-8')
          query = "\n".join([
              "  if (query) {",
              "    fullPool = fullPool.filter((item) => {",
              "      const matchTitle = item.title.toLowerCase().includes(query);",
              "      const matchTags = item.tags?.some((tag) => tag.toLowerCase().includes(query));",
              "      return matchTitle || matchTags;",
              "    });",
              "  }",
          ])
          t = between(t, "  if (query) {", "\n\n  // Deduplication Phase:", query, 'query filter')
          fallback = "\n".join([
              "  let finalSelectionPool = [...uniquePool];",
              "  if (finalSelectionPool.length < limit) {",
              "    const needed = limit - finalSelectionPool.length;",
              "    const backupPool: WebMemeItem[] = [];",
              "    for (const item of fullPool) {",
              "      const itemHash = (item.hash || computeImageSignature(item.title, item.imageUrl)).toLowerCase();",
              "      const imgUrl = item.imageUrl.toLowerCase().split('?')[0];",
              "      if (!seenHashes.has(itemHash) && !seenImageUrls.has(imgUrl)) {",
              "        seenHashes.add(itemHash);",
              "        seenImageUrls.add(imgUrl);",
              "        backupPool.push(item);",
              "        if (backupPool.length >= needed) break;",
              "      }",
              "    }",
              "    finalSelectionPool = [...finalSelectionPool, ...backupPool];",
              "  }",
          ])
          t = between(t, "  let finalSelectionPool = uniquePool;", "\n\n  // Balanced selection:", fallback, 'dedupe fallback')
          p.write_text(t, encoding='utf-8')

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MemeCanvas.tsx src/components/HistoryAndFavoritesPanel.tsx server/memeAggregator.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply reviewed core correctness and quota fixes [skip-review-fix]"
          git push
